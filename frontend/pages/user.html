<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/root.css">
    <link rel="stylesheet" href="/frontend/css/components.css">
    <link rel="stylesheet" href="/frontend/css/user.css">
    <title>Inicio - ATLAS</title>
</head>

<body>
    <!-- ============================================================
         CONTENEDOR PRINCIPAL
         ============================================================ -->
    <div class="app-content">

        <!-- ========================================================
             SIDEBAR
             Cada link lleva data-section="nombre" y href="#nombre".
             "nombre" debe coincidir con el id de la sección: section-nombre
             ======================================================== -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo ATLAS -->
            <div class="sidebar-header">
                <a href="#inicio">ATLAS</a>
            </div>

            <!-- Navegación principal -->
            <nav class="sidebar-nav" aria-label="Navegación principal">
                <ul class="nav-list">

                    <li class="nav-item">
                        <a href="#recordatorios" class="nav-link" data-section="recordatorios">
                            <span class="nav-icon" aria-hidden="true">📌</span>
                            <span class="nav-text">Recordatorios</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#alarmas" class="nav-link" data-section="alarmas">
                            <span class="nav-icon" aria-hidden="true">⏰</span>
                            <span class="nav-text">Alarmas</span>
                        </a>
                    </li>
                </ul>

                <button type="button" class="logout-button" id="logoutButton">
                    <span class="logout-icon" aria-hidden="true">⎋</span>
                    <span class="logout-text">Cerrar sesión</span>
                </button>
            </nav>
        </aside>

        <!-- Fondo oscuro que cubre la página cuando el sidebar se abre en móvil -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ========================================================
             CONTENIDO PRINCIPAL
             ======================================================== -->
        <main class="main-content">

            <header class="topbar">
                <button type="button" class="btn btn-ghost menu-toggle" data-sidebar-toggle aria-label="Abrir menú"
                    aria-controls="sidebar" aria-expanded="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>

                <h1 class="topbar-title">Inicio</h1>

                <div class="user-chip">
                    <span class="user-avatar" aria-hidden="true">U</span>
                    <span class="user-name" data-user-name>Usuario</span>
                </div>
            </header>

            <!-- ====================================================
                 SECCIONES
                 Solo una tiene .active a la vez (lo controla Sections.js).
                 Estructura: id="section-NOMBRE" + data-title="Título del topbar"
                 ==================================================== -->
            <div class="page">

                <!-- ---- Inicio ---- -->
                <section class="page-section active" id="section-inicio" data-title="Inicio">
                    <div class="page-intro">
                        <h2 tabindex="-1">Resumen de tu actividad</h2>
                        <p>Aquí verás tus pendientes y registros más recientes.</p>
                    </div>

                    <div class="stats-grid" aria-label="Indicadores">


                        <a href="#recordatorios" class="stat-card" data-stat="recordatorios">
                            <span class="stat-icon" aria-hidden="true">📌</span>
                            <p class="stat-label">Recordatorios</p>
                            <p class="stat-value">—</p>
                        </a>
                    </div>

                    <div class="board" id="board" aria-label="Recordatorios por estado"></div>
                </section>

                <!-- ---- Recordatorios ---- -->
                <section class="page-section" id="section-recordatorios" data-title="Recordatorios">
                    <div class="page-intro">
                        <h2 tabindex="-1">Recordatorios</h2>
                        <p>Tus pendientes y avisos importantes en un solo lugar.</p>
                    </div>
                    <div class="toolbar">
                        <input type="search" id="reminderSearch" class="toolbar-search"
                            placeholder="Buscar por folio, titulo o descripcion" aria-label="Buscar recordatorios">
                        <select id="reminderFilter" class="toolbar-select" aria-label="Filtrar por estado">
                            <option value="todos">Todos</option>
                            <option value="incompleto">Incompleto</option>
                            <option value="proceso">En Proceso</option>
                            <option value="completado">Completado</option>
                            <option value="externo">Externo</option>
                        </select>
                        <button type="button" class="btn btn-ghost" id="openSettings">✉ Ajuste de correo </button>
                        <button type="button" class="btn btn-accent" id="newReminder">+ Nuevo</button>
                    </div>
                    <div class="reminder-list" id="reminderList"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- ============================================================
         CONTENEDOR DE NOTIFICACIONES
         ============================================================ -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Lógica: user.js es el punto de entrada y carga el resto como módulos -->
    <script type="module" src="/frontend/js/user.js"></script>
</body>

</html>
