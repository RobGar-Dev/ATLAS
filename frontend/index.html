<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/root.css">
    <link rel="stylesheet" href="/frontend/css/components.css">
    <link rel="stylesheet" href="/frontend/css/index.css">
    <script src="js/PasswordToggle.js"></script>
    <script src="js/modals.js"></script>
    <title>Login - ATLAS</title>
</head>

<body>

    <div class="login-main">
        <div class="data-user surface-accent">
            <form action="/login" method="POST">
                <div class="inputs">

                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <div class="input-wrap has-icon">
                            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            <input type="text" id="username" name="username" placeholder="Tu usuario"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrap has-icon has-action">
                            <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Tu contraseña"
                                autocomplete="current-password" required>
                            <button type="button" class="input-action" data-toggle-password="password"
                                aria-label="Mostrar contraseña">
                                <svg class="icon-show" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icon-hide" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                                    <path
                                        d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                                    <line x1="2" x2="22" y1="2" y2="22" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forget-password">
                        <button type="button" class="link link-sm" data-modal-open="forgetPasswordModal">
                            ¿Olvidaste tu contraseña?
                        </button>
                    </div>

                </div>

                <div class="buttons">
                    <div class="login">
                        <button type="submit" class="btn btn-dark btn-lg btn-block">
                            Iniciar sesión
                            <svg class="btn-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14" />
                                <path d="m12 5 7 7-7 7" />
                            </svg>
                        </button>
                    </div>

                    <div class="divider">¿Aún no tienes cuenta?</div>

                    <div class="new-user">
                        <button type="button" class="btn btn-outline btn-block" data-modal-open="createAccountModal">
                            Crear una cuenta
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="presentation">
            <div class="main-title">
                <h1>Bienvenido</h1>
                <p>Mantente al día con tus pendientes y registros</p>
            </div>
        </div>
    </div>

    <!-- Modal: Olvidaste tu contraseña -->
    <div class="modal" id="forgetPasswordModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true">

            <button class="modal-close" type="button" aria-label="Cerrar modal">
                &times;
            </button>

            <div class="modal-header">
                <span class="modal-icon">🔐</span>

                <h2>¿Olvidaste tu contraseña?</h2>

                <p>
                    Ingresa tu dirección de correo electrónico y te enviaremos
                    las instrucciones para restablecer tu contraseña.
                </p>
            </div>

            <form action="/forgot-password" method="POST" class="modal-form">

                <div class="form-group">
                    <label for="forgot-email">
                        Correo electrónico
                    </label>

                    <input type="email" id="forgot-email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Enviar instrucciones
                </button>

            </form>

        </div>
    </div>


    <!-- Modal: Crear una cuenta -->
    <div class="modal" id="createAccountModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true">

            <button class="modal-close" type="button" aria-label="Cerrar modal">
                &times;
            </button>

            <div class="modal-header">
                <span class="modal-icon">👤</span>

                <h2>Crea una cuenta</h2>

                <p>
                    Ingresa tus datos para crear una nueva cuenta.
                </p>
            </div>

            <form action="/register" method="POST" class="modal-form">

                <div class="form-group">
                    <label for="username">
                        Nombre de usuario
                    </label>

                    <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Crear cuenta
                </button>

            </form>

        </div>
    </div>
    <!-- ============================================================
         CONTENEDOR DE NOTIFICACIONES
         ============================================================ -->

    <div class="toast-container" id="toast-container" aria-live="polite">
    </div>
</body>

</html>
